spring.application.name=kb-backend

# MySQL (로컬 개발용) - 계정/비밀번호는 환경변수(DB_USERNAME/DB_PASSWORD)로 주입
spring.datasource.url=jdbc:mysql://localhost:3306/kbdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - 배포 환경에서는 반드시 JWT_SECRET 환경변수로 재정의할 것
jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-key-32bytes-min}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=1209600000

# Perplexity(Sonar) - AI 추천/어드바이스
# enabled 기본값은 false. 개발 중에는 규칙 기반으로 동작하고 크레딧을 쓰지 않는다.
# 진짜 호출이 필요할 때만 AI_ENABLED=true 로 켠다 (기능 검증 / 리허설 / 시연).
perplexity.enabled=${AI_ENABLED:false}
# 키는 반드시 환경변수로. 이 파일에 값을 직접 적으면 깃허브에 올라가 폐기된다.
perplexity.api.key=${PERPLEXITY_API_KEY:}
perplexity.api.url=https://api.perplexity.ai/chat/completions
perplexity.model=sonar
perplexity.timeout-seconds=20
# 하루 호출 상한. 반복 호출 사고로 크레딧이 사라지는 것을 막는다 (300회 ≈ $2)
perplexity.daily-limit=300

spring.application.name=kb-backend

# H2 in-memory DB (로컬 개발용)
spring.datasource.url=jdbc:h2:mem:kbdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# 온통청년 API 설정 (환경변수 YOUTH_API_KEY 사용, 없으면 기본값 적용)
youth.policy.api.key=${YOUTH_API_KEY:default_key_here}
youth.policy.api.url=https://www.youthcenter.go.kr/opi/empSprtList.do

# 에러 메시지 포함 설정
server.error.include-message=always